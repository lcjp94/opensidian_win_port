# Throwaway: build and test a contribution branch, based on upstream develop, on Linux.
# Lives only on ci/* branches of the fork; never part of a pull request.
name: Contribution check
on:
  push:
    branches: ["ci/**"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
